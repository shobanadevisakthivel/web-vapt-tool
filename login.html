<!DOCTYPE html>
<html>
<head>
    <title>Login | VAPT</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #05080f;
            font-family: Inter;
        }

        .box {
            width: 360px;
            padding: 30px;
            background: #0b1220;
            border: 1px solid #1f2937;
            border-radius: 14px;
            text-align: center;
        }

        h2 {
            color: #60a5fa;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #1f2937;
            background: #05080f;
            color: white;
            outline: none;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            background: #2563eb;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-weight: 600;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            color: #ef4444;
            margin-top: 10px;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>🛡 VAPT LOGIN</h2>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
</div>

</body>
</html>
